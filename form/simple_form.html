<!DOCTYPE html>
<html>
    <head>
        <title>Simple form</title>
        <link rel="stylesheet" href="simple_form.CSS">
    </head>
    <body>
        <div>
            <form>
                <div class="info">
                    <h1>Sign Up Form</h1>
                    <label>Fullname:</label>
                    <input type="text"
                    name="name"
                    placeholder="Salihu Ibrahim"
                    minlength="3"
                    maxlength="20"
                    required> <br>

                    <label>Phone number:</label>
                    <input type="tel"
                    placeholder="08011____"
                    required> <br>
                    <label for="pwd">password:</label>
                    <input type="text"
                    id="pwd"
                    placeholder="create a password"
                    minlength="6"
                    maxlength="15"
                    required> <br>

                    <label>Email:</label>
                    <input type="email"
                    id="email"
                    placeholder="example@email.com"
                    required> <br>

                    <label>Date of Birth:</label>
                    <input type="date"
                    id="dob"
                    name="dob"
                    required> <br>
                </div>

                <div class="radio">
                    <label>sex:</label>
                    <select>
                        <option>Male</option>
                        <option>FEMALE</option>
                    </select> 
                    <p>
                        <label>HTML</label>
                        <input type="radio"
                        name="skills">

                        <label>CSS</label>
                        <input type="radio"
                        name="skills">

                        <label>JavaScript</label>
                        <input type="radio"
                        name="skills">
                    </p>
                </div>    

                <div class="hobby">
                    <h3>CHOOSE YOUR HOBBYS</h3>

                    <label>Football</label>
                    <input type="checkbox"
                    name="hobby">

                    <label>Reading</label>
                    <input type="checkbox"
                    name="hobby">

                    <label>Skating</label>
                    <input type="checkbox"
                    name="hobby">

                    <label>coding</label>
                    <input type="checkbox"
                    name="hobby"
                    id="coding">
                </div>
                <button type="submit">submit</button>
            </form>
        </div>    
    </body>
</html>
